<h2>User CRUD Operations:</h2>

<h2>1. Add New USER</h2>
<div>
    <form #saveUserForm="ngForm" (ngSubmit)="saveUser(saveUserForm.value)">

        <input type="text" name="id" placeholder="Enter User Id" [ngModel]="selectedUser?.id">
        <br><br>

        <input type="text" name="name" placeholder="Enter User Name" [ngModel]="selectedUser?.name">
        <br><br>

        <input type="text" name="age" placeholder="Enter User Age" [ngModel]="selectedUser?.age">
        <br><br>

        @if(!selectedUser){
        <button>Add User</button>
        } @else {
        <button>Update User</button>
        }

    </form>
</div>

<hr>

<h2>2. Get All User:</h2>

<button (click)="getALlUsers()">Get All Users:</button>

<ul>
    @for(user of userList; track $index) {
    <li>
        {{user.id}} - {{user.name}} - {{user.age}}
        <button (click)="deleteUser(user.id)">Delete</button>
        &nbsp;
        <button (click)="getUserById(user.id)">Edit</button>
    </li>
    <br>
    }
</ul>
